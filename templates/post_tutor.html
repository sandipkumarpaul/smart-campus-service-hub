{% extends 'base.html' %}

{% block title %}Post a Tutor{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0"><i class="bi bi-person-plus-fill me-2"></i>Post a Tutor</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('post_tutor') }}" id="postTutorForm">
                    {% if admin_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Admin Token (required)</label>
                        <input type="password" name="admin_token" class="form-control" required>
                    </div>
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label fw-bold">Name</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Major</label>
                            <input type="text" name="major" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Subject</label>
                            <input type="text" name="subject" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Bio</label>
                        <textarea name="bio" class="form-control" rows="4"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Contact Info (email)</label>
                        <input type="email" name="contact_info" class="form-control" required>
                    </div>

                    <div class="d-grid">
                        <button class="btn btn-primary">Post Tutor</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white text-center">
                <h4 class="mb-0">💬 Campus Messaging (General Chat)</h4>
            </div>
            
            <div class="card-body" style="height: 400px; overflow-y: auto; background-color: #F1F5F9;">
                {% for msg in messages %}
                <div class="mb-3 p-3 bg-white rounded shadow-sm border">
                    <div class="d-flex justify-content-between mb-1">
                        <strong class="text-primary">{{ msg.sender.full_name }}</strong>
                        <small class="text-muted">Just now</small>
                    </div>
                    <p class="mb-0">{{ msg.message_text }}</p>
                </div>
                {% else %}
                <div class="text-center text-muted mt-5">
                    <p>No messages yet. Start the conversation!</p>
                </div>
                {% endfor %}
            </div>

            <div class="card-footer bg-white p-3">
                <form action="{{ url_for('messages') }}" method="POST">
                    <div class="input-group">
                        <input type="text" name="content" class="form-control" placeholder="Type your message..." required>
                        <button type="submit" class="btn btn-primary">Send ✉️</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

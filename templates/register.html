{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm p-4 border-0 border-top border-4 border-success">
            <h3 class="text-center mb-4 fw-bold">Join the Campus Hub</h3>
            <form method="POST" action="{{ url_for('register') }}">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Full Name</label>
                        <input type="text" name="full_name" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">BRACU Email</label>
                    <input type="email" name="email" class="form-control" placeholder="student@g.bracu.ac.bd" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Department</label>
                        <input type="text" name="department" class="form-control" placeholder="e.g. CSE" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold">Create Account</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

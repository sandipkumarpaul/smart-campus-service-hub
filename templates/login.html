{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm p-4 border-0 border-top border-4 border-primary">
            <h3 class="text-center mb-4 fw-bold">Welcome Back</h3>
            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label class="form-label fw-bold">BRACU Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold">Secure Login</button>
            </form>
            <div class="text-center mt-3">
                <small>Don't have an account? <a href="{{ url_for('register') }}">Sign up here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}

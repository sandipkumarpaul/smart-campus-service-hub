{% extends "base.html" %}

{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 700px;">
    <div class="card-body">
        <h2 class="mb-4 text-center">Upload Notes</h2>

        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Title of Notes</label>
                <input type="text" name="title" class="form-control" placeholder="Enter note title">
            </div>

            <div class="mb-3">
                <label class="form-label">Course Name</label>
                <input type="text" name="course" class="form-control" placeholder="Enter course name">
            </div>

            <div class="mb-3">
                <label class="form-label">Term</label>
                <select name="term" class="form-select">
                    <option value="">Select Term</option>
                    <option value="Spring">Spring</option>
                    <option value="Summer">Summer</option>
                    <option value="Fall">Fall</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Year</label>
                <select name="year" class="form-select">
                    <option value="">Select Year</option>
                    <option value="2023">2023</option>
                    <option value="2024">2024</option>
                    <option value="2025">2025</option>
                    <option value="2026">2026</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Upload File (PDF or DOCX)</label>
                <input type="file" name="file" class="form-control" accept=".pdf,.docx">
            </div>

            <button type="submit" class="btn btn-primary w-100">Upload Note</button>
        </form>
    </div>
</div>
{% endblock %}
